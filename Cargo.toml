#:schema https://www.schemastore.org/cargo.json

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/VioletsOleander/cakestry"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
