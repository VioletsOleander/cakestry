#:schema https://www.schemastore.org/cargo.json

[package]
name = "cakestry"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "An agent in the terminal"
repository = "https://github.com/VioletsOleander/cakestry"

[dependencies]
anyhow = "1.0.103"
async-openai = { version = "0.41.3", features = ["responses", "completions"] }
clap = { version = "4.6.1", features = ["derive"] }
crossbeam-channel = "0.5.16"
crossterm = { version = "0.29.0" }
futures = "0.3.34"
ratatui = { version = "0.30.2" }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
toml = "1.1.4"
tracing = { version = "0.1.44", features = ["release_max_level_info"] }
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

# Tool: Typos
[package.metadata.typos.files]
extend-exclude = ["/src/terminal/document/textwrap.rs"]

[package.metadata.typos.default.extend-identifiers]
RatatuiWidget = "RatatuiWidget"
