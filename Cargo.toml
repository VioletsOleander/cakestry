#:schema https://www.schemastore.org/cargo.json

[package]
name = "cakestry"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
ratatui = { version = "0.30.2" }
textwrap = { version = "0.16.2", default-features = false, features = ["unicode-linebreak", "unicode-width"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
unicode-width = "0.2.2"
